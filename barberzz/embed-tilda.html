<!-- Barberzz: 3D-бюст для Тильды.
     Куда: Zero Block первого экрана → «Добавить элемент» → HTML → вставить этот код целиком.
     Размер HTML-элемента: как у текущей картинки бюста (549 × 661), картинку бюста потом скрыть. -->
<div class="bz-bust" data-src="https://denisfletcer1-a11y.github.io/barberzz/bust/" data-frames="230" style="position:relative;width:100%;height:100%;min-height:420px"></div>
<style>
  .bz-bust { touch-action: pan-y; }
  .bz-bust canvas { opacity: 0; transition: opacity .6s ease; }
  .bz-bust.bz-ready canvas { opacity: 1; }
  .bz-hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 7px 14px; border-radius: 30px; background: rgba(0,0,0,.55); color: #fff; font: 500 13px/1 'TildaSans', Arial, sans-serif; white-space: nowrap; pointer-events: none; transition: opacity .5s; }
  .bz-hint span { color: #e8ad21; margin-right: 4px; }
  .bz-touched .bz-hint { opacity: 0; }
</style>
<script src="https://denisfletcer1-a11y.github.io/barberzz/bust.js" defer></script>
