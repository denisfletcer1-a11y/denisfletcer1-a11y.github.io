<div class="bz-bust" data-video="https://denisfletcer1-a11y.github.io/barberzz/bust.mp4?v=5" data-poster="https://denisfletcer1-a11y.github.io/barberzz/bust-poster.jpg?v=5" style="position:relative;width:100%;height:100%;min-height:420px"></div>
<style>
  .bz-bust { touch-action: pan-y; user-select: none; -webkit-user-select: none; }

  .bz-bust.bz-ready video { opacity: 1; }
  .bz-hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 7px 14px; border-radius: 30px; background: rgba(0,0,0,.55); color: #fff; font: 500 13px/1 'TildaSans', Arial, sans-serif; white-space: nowrap; pointer-events: none; transition: opacity .5s; }

</style>
